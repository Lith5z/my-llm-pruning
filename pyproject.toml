[project]
name = "my-llm-pruning"
version = "0.1.0"
description = "A personal project to reproduce LLM pruning paper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy",
    "torch==2.14.0+cu132",
    "torchvision>=0.29.0",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
